<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GRIZZLY — кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --or:#ff8a00; --bg:#0d0d0d; --card:#171717; --line:#262626; --tx:#f2f2f2; --mut:#9a9a9a; --ok:#38c172; --bad:#ff6b6b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif; padding:14px 14px 40px; }
  h1 { font-size:20px; margin:0 0 2px; color:var(--or); letter-spacing:.5px; }
  h2 { font-size:16px; margin:0 0 8px; }
  .mut { color:var(--mut); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; }
  .card.or { border-color:var(--or); }
  .row { display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:none; }
  .big { font-size:22px; font-weight:700; }
  .pill { display:inline-block; font-size:12px; padding:3px 9px; border-radius:20px; background:#222; color:var(--mut); }
  .pill.on { background:rgba(56,193,114,.15); color:var(--ok); }
  input { width:100%; background:#0f0f0f; color:var(--tx); border:1px solid #333; border-radius:12px; padding:13px; font-size:22px; letter-spacing:6px; text-align:center; margin-top:10px; }
  button { width:100%; margin-top:10px; padding:13px; border-radius:12px; border:1px solid #333; background:#222; color:var(--tx); font-size:15px; }
  button.pri { background:var(--or); border-color:var(--or); color:#000; font-weight:700; }
  button.ghost { background:none; color:var(--mut); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .tile { background:#111; border:1px solid var(--line); border-radius:12px; padding:10px; }
  .tile b { display:block; font-size:17px; margin-top:2px; }
  .err { color:var(--bad); margin-top:8px; font-size:14px; }
  .spin { text-align:center; padding:60px 0; color:var(--mut); }
</style>
</head>
<body>
<h1>GRIZZLY</h1>
<div class="mut" id="sub">Личный кабинет</div>
<div id="app"><div class="spin">Загрузка…</div></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#0d0d0d'); tg.setBackgroundColor && tg.setBackgroundColor('#0d0d0d'); }
const API = new URLSearchParams(location.search).get('api') || 'https://grizzly.WORKER.workers.dev';
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const money = n => '$' + Number(n || 0).toLocaleString('ru-RU');
const hours = s => { s = Number(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} ч ${m} мин` : `${m} мин`; };

async function call(req) {
  const r = await fetch(API, { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ initData: tg ? tg.initData : '', req }) });
  return r.json();
}

function linkScreen(msg) {
  app.innerHTML = `<div class="card or">
    <h2>Привяжи аккаунт</h2>
    <div class="mut">1. Зайди на сервер и напиши в чат <b style="color:var(--or)">/tglink</b><br>2. Введи код, который покажет игра</div>
    <input id="code" inputmode="numeric" maxlength="6" placeholder="000000">
    <button class="pri" id="go">Привязать</button>
    <div class="err" id="e">${esc(msg || '')}</div></div>`;
  const go = async () => {
    const code = document.getElementById('code').value.trim();
    if (!/^\d{6}$/.test(code)) return document.getElementById('e').textContent = 'Код — 6 цифр';
    document.getElementById('go').disabled = true;
    const r = await call({ a:'link', code }).catch(e => ({ ok:false, err:String(e) }));
    if (r.ok) { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); load(); }
    else { document.getElementById('e').textContent = r.err || 'Ошибка'; document.getElementById('go').disabled = false; }
  };
  document.getElementById('go').onclick = go;
}

function profileScreen(d) {
  document.getElementById('sub').innerHTML = `Аккаунт <b>${esc(d.login)}</b> · онлайн ${d.players}/${d.maxPlayers}`;
  const total = d.chars.reduce((s, c) => s + c.money + (c.bank ? c.bank.balance : 0), 0);
  let h = `<div class="card or">
      <div class="mut">Все деньги на аккаунте</div><div class="big">${money(total)}</div>
      <div style="margin-top:6px">${d.online ? `<span class="pill on">● В игре: ${esc(d.online)}</span>` : '<span class="pill">Не в игре</span>'}</div>
    </div>`;
  for (const c of d.chars) {
    h += `<div class="card"><h2>${esc(c.name)}</h2>
      <div class="grid">
        <div class="tile"><span class="mut">Наличные</span><b>${money(c.money)}</b></div>
        <div class="tile"><span class="mut">Банк ${c.bank ? esc(c.bank.card) : ''}</span><b>${c.bank ? money(c.bank.balance) : '—'}</b></div>
        <div class="tile"><span class="mut">В игре</span><b>${hours(c.playtime)}</b></div>
        <div class="tile"><span class="mut">Машины</span><b>${c.cars}</b></div>
      </div>
      ${c.houses.length ? `<div class="row"><span>🏠 Дома</span><span>${c.houses.map(x => '№' + x.id).join(', ')}</span></div>` : ''}
      ${c.shops.length ? `<div class="row"><span>🛒 Бизнесы</span><span>${c.shops.map(x => esc(x.name)).join(', ')}</span></div>` : ''}
      ${c.last ? `<div class="row"><span class="mut">Последний вход</span><span class="mut">${esc(c.last)}</span></div>` : ''}
    </div>`;
  }
  if (!d.chars.length) h += `<div class="card mut">На аккаунте пока нет персонажей.</div>`;
  h += `<div class="card"><div class="row"><span class="mut">Почта</span><span>${esc(d.email || '—')}</span></div>
      <div class="row"><span class="mut">Регистрация</span><span>${esc(d.registered || '—')}</span></div></div>
    <button id="ref">🔄 Обновить</button>
    <button class="ghost" id="un">Отвязать Telegram</button>`;
  app.innerHTML = h;
  document.getElementById('ref').onclick = load;
  document.getElementById('un').onclick = async () => {
    const yes = await new Promise(res => tg && tg.showConfirm ? tg.showConfirm('Отвязать Telegram от аккаунта?', res) : res(confirm('Отвязать?')));
    if (yes) { await call({ a:'unlink' }); document.getElementById('sub').textContent = 'Личный кабинет'; linkScreen(); }
  };
}

async function load() {
  if (!tg || !tg.initData) { app.innerHTML = '<div class="card">Открой кабинет из Telegram-бота GRIZZLY: команда /cabinet.</div>'; return; }
  app.innerHTML = '<div class="spin">Загрузка…</div>';
  try {
    const d = await call({ a:'me' });
    if (d.ok) return profileScreen(d);
    if (d.err === 'nolink') return linkScreen();
    app.innerHTML = `<div class="card"><div class="err">${esc(d.err || 'Ошибка')}</div><button id="r">Повторить</button></div>`;
    document.getElementById('r').onclick = load;
  } catch (e) {
    app.innerHTML = `<div class="card"><div class="err">Сервер недоступен</div><div class="mut">${esc(e)}</div><button id="r">Повторить</button></div>`;
    document.getElementById('r').onclick = load;
  }
}
load();
</script>
</body>
</html>
